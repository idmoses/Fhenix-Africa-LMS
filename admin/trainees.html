<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainees — Fhenix Africa Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="fx-app">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-overlay" id="fxOverlay"></div>
  <div class="fx-main">
    <div class="fx-topbar">
      <div class="d-flex gap-12" style="align-items:center;">
        <button class="fx-burger" id="fxBurger"><i class="bi bi-list"></i></button>
        <span class="page-title" id="fxPageTitle"></span>
      </div>
    </div>
    <div class="fx-content">
      <div class="fx-table-wrap">
        <div class="fx-table-toolbar">
          <input class="form-control" id="fxSearch" placeholder="Search by name, email, phone or trainee ID" style="max-width:320px;">
          <div class="filters">
            <select class="form-control" id="fxFilterTrack"><option value="">All Tracks</option></select>
            <select class="form-control" id="fxFilterPayment"><option value="">All Payment Status</option><option>Fully Paid</option><option>Partially Paid</option><option>Payment Due</option><option>Overdue</option></select>
            <select class="form-control" id="fxFilterStatus"><option value="">All Status</option><option>Active</option><option>Completed</option><option>Suspended</option></select>
          </div>
        </div>
        <table class="fx-table">
          <thead><tr><th>Trainee</th><th>Track</th><th>Amount Paid</th><th>Balance</th><th>Progress</th><th>Payment Status</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="fxTraineeRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  FxAuth.guardAdmin();
  fxRenderShell({ role: 'admin', active: 'trainees.html', title: 'Trainees' });

  const trackFilter = document.getElementById('fxFilterTrack');
  trackFilter.innerHTML += FxData.tracks().map(t => `<option value="${t.id}">${t.name}</option>`).join('');

  function render() {
    const q = document.getElementById('fxSearch').value.trim().toLowerCase();
    const trackVal = trackFilter.value, payVal = document.getElementById('fxFilterPayment').value, statVal = document.getElementById('fxFilterStatus').value;

    let list = FxData.trainees();
    if (q) list = list.filter(t => (t.firstName + ' ' + t.lastName).toLowerCase().includes(q) || t.email.toLowerCase().includes(q) || t.phone.includes(q) || t.traineeId.toLowerCase().includes(q));
    if (trackVal) list = list.filter(t => t.track === trackVal);
    if (payVal) list = list.filter(t => t.payment.status === payVal);
    if (statVal) list = list.filter(t => t.status === statVal);

    document.getElementById('fxTraineeRows').innerHTML = list.length ? list.map(t => `
      <tr>
        <td><div style="font-weight:600;color:var(--fx-navy);">${t.firstName} ${t.lastName}</div><div class="text-muted-fx" style="font-size:.78rem;">${t.traineeId} · ${t.email}</div></td>
        <td>${FxData.track(t.track) ? FxData.track(t.track).name : t.track}</td>
        <td>${fxCurrency(t.payment.amountPaid)}</td>
        <td>${fxCurrency(t.payment.balance)}</td>
        <td style="min-width:120px;"><div class="fx-progress"><span style="width:${t.progress.percentage}%"></span></div><div class="text-muted-fx" style="font-size:.76rem;margin-top:4px;">${t.progress.percentage}%</div></td>
        <td><span class="fx-badge ${fxPaymentBadgeClass(t.payment.status)}">${t.payment.status}</span></td>
        <td><span class="fx-badge ${fxStatusBadgeClass(t.status)}">${t.status}</span></td>
        <td><a href="trainee-view.html?id=${t.traineeId}" class="btn-fx-outline" style="padding:.4rem .8rem;font-size:.82rem;">View</a></td>
      </tr>`).join('') : `<tr><td colspan="8"><div class="fx-empty"><div class="icon"><i class="bi bi-search"></i></div>No trainees match your search or filters.</div></td></tr>`;
  }

  ['fxSearch'].forEach(id => document.getElementById(id).addEventListener('input', render));
  ['fxFilterTrack', 'fxFilterPayment', 'fxFilterStatus'].forEach(id => document.getElementById(id).addEventListener('change', render));
  render();
</script>
</body>
</html>
