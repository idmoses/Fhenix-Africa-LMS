<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — Fhenix Africa</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="fx-app">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-overlay" id="fxOverlay"></div>
  <div class="fx-main">
    <div class="fx-topbar">
      <div class="d-flex gap-12" style="align-items:center;">
        <button class="fx-burger" id="fxBurger"><i class="bi bi-list"></i></button>
        <span class="page-title" id="fxPageTitle"></span>
      </div>
    </div>
    <div class="fx-content">
      <div class="fx-summary-grid" id="fxSummaryGrid"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">
        <div class="fx-card">
          <div class="flex-between"><h3 class="mt-0">Recent Registrations</h3><a href="trainees.html" class="btn-fx-outline">View All</a></div>
          <div id="fxRecentTrainees"></div>
        </div>
        <div class="fx-card">
          <div class="flex-between"><h3 class="mt-0">Pending Receipts</h3><a href="receipts.html" class="btn-fx-outline">Review</a></div>
          <div id="fxPendingReceipts"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  FxAuth.guardAdmin();
  fxRenderShell({ role: 'admin', active: 'dashboard.html', title: 'Dashboard' });

  const trainees = FxData.trainees();
  const receipts = FxData.receipts();
  const active = trainees.filter(t => t.status === 'Active').length;
  const completed = trainees.filter(t => t.status === 'Completed').length;
  const pendingReceipts = receipts.filter(r => r.status === 'Pending');
  const outstanding = trainees.reduce((sum, t) => sum + (t.payment.balance || 0), 0);

  document.getElementById('fxSummaryGrid').innerHTML = `
    <div class="fx-summary-card"><div class="icon icon-blue"><i class="bi bi-people-fill"></i></div><div class="lbl">Total Trainees</div><div class="val">${trainees.length}</div></div>
    <div class="fx-summary-card"><div class="icon icon-green"><i class="bi bi-person-check"></i></div><div class="lbl">Active Trainees</div><div class="val">${active}</div></div>
    <div class="fx-summary-card"><div class="icon icon-orange"><i class="bi bi-mortarboard"></i></div><div class="lbl">Completed Training</div><div class="val">${completed}</div></div>
    <div class="fx-summary-card"><div class="icon icon-red"><i class="bi bi-cash-coin"></i></div><div class="lbl">Pending Payments</div><div class="val" style="font-size:1.25rem;">${fxCurrency(outstanding)}</div></div>`;

  document.getElementById('fxRecentTrainees').innerHTML = trainees.slice(-5).reverse().map(t => `
    <div class="fx-module-row"><div><div style="font-weight:600;color:var(--fx-navy);">${t.firstName} ${t.lastName}</div>
    <div class="text-muted-fx" style="font-size:.8rem;">${t.traineeId} · ${FxData.track(t.track) ? FxData.track(t.track).name : t.track}</div></div>
    <span class="fx-badge ${fxStatusBadgeClass(t.status)}">${t.status}</span></div>`).join('');

  document.getElementById('fxPendingReceipts').innerHTML = pendingReceipts.length ? pendingReceipts.map(r => {
    const tr = FxData.trainee(r.traineeId);
    return `<div class="fx-module-row"><div><div style="font-weight:600;color:var(--fx-navy);">${tr ? tr.firstName + ' ' + tr.lastName : r.traineeId}</div>
    <div class="text-muted-fx" style="font-size:.8rem;">${fxCurrency(r.amount)} · ${fxDate(r.date)}</div></div>
    <span class="fx-badge badge-amber">Pending</span></div>`;
  }).join('') : `<div class="fx-empty"><div class="icon"><i class="bi bi-check2-circle"></i></div>No pending receipts.</div>`;
</script>
</body>
</html>
