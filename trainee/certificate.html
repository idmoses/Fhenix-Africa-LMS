<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate — Fhenix Africa</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="fx-app">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-overlay" id="fxOverlay"></div>
  <div class="fx-main">
    <div class="fx-topbar">
      <div class="d-flex gap-12" style="align-items:center;">
        <button class="fx-burger" id="fxBurger"><i class="bi bi-list"></i></button>
        <span class="page-title" id="fxPageTitle"></span>
      </div>
    </div>
    <div class="fx-content" id="fxCertWrap"></div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  FxAuth.guardTrainee();
  fxRenderShell({ role: 'trainee', active: 'certificate.html', title: 'Certificate' });
  const t = FxAuth.currentTrainee();
  const track = FxData.track(t.track);
  const wrap = document.getElementById('fxCertWrap');

  if (t.certificate.available) {
    wrap.innerHTML = `
      <div class="fx-card" style="text-align:center;padding:40px;">
        <div class="icon icon-green" style="width:56px;height:56px;font-size:1.4rem;margin:0 auto 16px;"><i class="bi bi-patch-check-fill"></i></div>
        <h3>Congratulations! Your Certificate Is Ready</h3>
        <div class="fx-card" style="max-width:520px;margin:20px auto;border:2px solid var(--fx-blue);text-align:left;">
          <div class="text-muted-fx" style="font-size:.8rem;">Certificate of Completion</div>
          <h3 style="margin:6px 0;">${t.firstName} ${t.lastName}</h3>
          <p class="mb-0">has successfully completed the <strong>${track ? track.name : t.track}</strong> training program.</p>
          <div class="flex-between" style="margin-top:16px;font-size:.85rem;">
            <span>Completion date: ${fxDate(t.endDate)}</span>
            <span>ID: ${t.certificate.certificateId}</span>
          </div>
        </div>
        <div class="d-flex gap-12" style="justify-content:center;">
          <button class="btn-fx-primary" onclick="fxToast('Opening certificate preview…','success')">View Certificate</button>
          <button class="btn-fx-orange" onclick="fxToast('Certificate download started.','success')">Download Certificate</button>
        </div>
      </div>`;
  } else {
    wrap.innerHTML = `
      <div class="fx-empty fx-card" style="padding:50px;">
        <div class="icon"><i class="bi bi-patch-exclamation"></i></div>
        <h3 style="color:var(--fx-navy);">Certificate Not Yet Available</h3>
        <p>Complete your training requirements to receive your certificate.</p>
        <p class="mb-0">Current progress: <strong>${t.progress.percentage}%</strong> (${t.progress.completedLessons} of ${t.progress.totalLessons} lessons)</p>
      </div>`;
  }
</script>
</body>
</html>
