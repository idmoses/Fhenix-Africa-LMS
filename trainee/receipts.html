<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Receipts — Fhenix Africa</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="fx-app">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-overlay" id="fxOverlay"></div>
  <div class="fx-main">
    <div class="fx-topbar">
      <div class="d-flex gap-12" style="align-items:center;">
        <button class="fx-burger" id="fxBurger"><i class="bi bi-list"></i></button>
        <span class="page-title" id="fxPageTitle"></span>
      </div>
    </div>
    <div class="fx-content">
      <div class="flex-between" style="margin-bottom:18px;">
        <p class="mb-0 text-muted-fx">Upload proof of payment so our finance team can verify it.</p>
        <button class="btn-fx-orange" onclick="fxOpenModal('fxUploadModal')"><i class="bi bi-upload"></i> Upload Payment Receipt</button>
      </div>
      <div id="fxReceiptList"></div>
    </div>
  </div>
</div>

<div class="fx-modal-backdrop" id="fxUploadModal">
  <div class="fx-modal">
    <div class="fx-modal-head"><strong>Upload Payment Receipt</strong><button class="fx-modal-close" onclick="fxCloseModal('fxUploadModal')">&times;</button></div>
    <div class="fx-modal-body">
      <form id="fxReceiptForm" novalidate>
        <div class="form-group"><label class="form-label">Payment Amount</label><input type="number" class="form-control" name="amount" min="1" required></div>
        <div class="form-group"><label class="form-label">Payment Date</label><input type="date" class="form-control" name="date" required></div>
        <div class="form-group"><label class="form-label">Payment Method</label>
          <select class="form-control" name="method" required><option value="">Select method</option><option>Bank Transfer</option><option>Card Payment</option><option>Cash</option></select>
        </div>
        <div class="form-group"><label class="form-label">Transaction / Reference Number</label><input class="form-control" name="reference" required></div>
        <div class="form-group"><label class="form-label">Upload Receipt (JPG, PNG or PDF)</label><input type="file" class="form-control" name="file" accept=".jpg,.jpeg,.png,.pdf" required></div>
        <div class="form-group"><label class="form-label">Note (optional)</label><textarea class="form-control" name="note" rows="2"></textarea></div>
        <button type="submit" class="btn-fx-orange" style="width:100%;padding:.7rem;">Submit Receipt</button>
      </form>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  FxAuth.guardTrainee();
  fxRenderShell({ role: 'trainee', active: 'receipts.html', title: 'Payment Receipts' });
  const t = FxAuth.currentTrainee();

  function render() {
    const receipts = FxData.receiptsForTrainee(t.traineeId).sort((a, b) => new Date(b.date) - new Date(a.date));
    document.getElementById('fxReceiptList').innerHTML = receipts.length ? `
      <div class="fx-table-wrap"><table class="fx-table"><thead><tr>
        <th>Reference</th><th>Amount</th><th>Date</th><th>Method</th><th>Receipt</th><th>Status</th>
      </tr></thead><tbody>
      ${receipts.map(r => `<tr>
        <td>${r.reference}</td><td>${fxCurrency(r.amount)}</td><td>${fxDate(r.date)}</td><td>${r.method}</td>
        <td><i class="bi bi-file-earmark-text"></i> ${r.fileName}</td>
        <td><span class="fx-badge ${fxReceiptBadgeClass(r.status)}">${r.status}</span></td>
      </tr>`).join('')}
      </tbody></table></div>` :
      `<div class="fx-empty"><div class="icon"><i class="bi bi-receipt"></i></div>No payment receipts yet. Upload your receipt after making a payment.</div>`;
  }

  document.getElementById('fxReceiptForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const form = e.target;
    if (!fxValidateRequired(form)) { fxToast('Please fill in all required fields.', 'error'); return; }
    const data = Object.fromEntries(new FormData(form).entries());
    const fileInput = form.querySelector('[name="file"]');
    const receipts = FxData.receipts();
    const id = 'RCT-' + String(receipts.length + 1).padStart(4, '0');
    receipts.push({
      id, traineeId: t.traineeId, amount: Number(data.amount), date: data.date, method: data.method,
      reference: data.reference, note: data.note || '', fileName: fileInput.files[0] ? fileInput.files[0].name : 'receipt-file', status: 'Pending'
    });
    FxData.saveReceipts(receipts);
    fxCloseModal('fxUploadModal');
    form.reset();
    fxToast('Receipt Submitted — Awaiting Admin Verification', 'success');
    render();
  });

  render();
</script>
</body>
</html>
