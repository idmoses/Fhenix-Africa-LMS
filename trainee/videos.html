<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Videos — Fhenix Africa</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="fx-app">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-overlay" id="fxOverlay"></div>
  <div class="fx-main">
    <div class="fx-topbar">
      <div class="d-flex gap-12" style="align-items:center;">
        <button class="fx-burger" id="fxBurger"><i class="bi bi-list"></i></button>
        <span class="page-title" id="fxPageTitle"></span>
      </div>
    </div>
    <div class="fx-content">
      <p class="text-muted-fx" id="fxTrackLine" style="margin-top:-6px;"></p>
      <div id="fxLessonList"></div>
    </div>
  </div>
</div>

<div class="fx-modal-backdrop" id="fxVideoModal">
  <div class="fx-modal" style="max-width:720px;">
    <div class="fx-modal-head"><strong id="fxVideoTitle"></strong><button class="fx-modal-close" onclick="fxCloseModal('fxVideoModal')">&times;</button></div>
    <div class="fx-modal-body">
      <div style="position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden;">
        <iframe id="fxVideoFrame" src="" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  FxAuth.guardTrainee();
  fxRenderShell({ role: 'trainee', active: 'videos.html', title: 'Class Videos' });
  let t = FxAuth.currentTrainee();
  const track = FxData.track(t.track);
  document.getElementById('fxTrackLine').textContent = `Showing lessons for your track: ${track ? track.name : t.track}`;

  function render() {
    t = FxAuth.currentTrainee();
    const lessons = FxData.lessonsForTrack(t.track);
    document.getElementById('fxLessonList').innerHTML = lessons.map(l => {
      const done = t.progress.completedLessonIds.includes(l.id);
      return `<div class="fx-lesson-card">
        <div class="fx-lesson-thumb" style="cursor:pointer;" onclick="fxPlay('${l.id}','${l.title.replace(/'/g, "\\'")}')"><i class="bi bi-play-fill"></i></div>
        <div class="fx-lesson-body">
          <div class="fx-lesson-head">
            <div>
              <div class="text-muted-fx" style="font-size:.78rem;">${l.module} · Lesson ${l.order}</div>
              <div style="font-weight:700;color:var(--fx-navy);">${l.title}</div>
            </div>
            <span class="fx-badge ${done ? 'badge-green' : 'badge-blue'}"><i class="bi ${done ? 'bi-check-circle-fill' : 'bi-play-circle'}"></i> ${done ? 'Completed' : 'Not completed'}</span>
          </div>
          <p class="text-muted-fx" style="margin:8px 0;">${l.desc}</p>
          <div class="d-flex gap-8" style="align-items:center;">
            <span class="text-muted-fx" style="font-size:.82rem;"><i class="bi bi-clock"></i> ${l.duration}</span>
            <button class="btn-fx-outline" onclick="fxPlay('${l.id}','${l.title.replace(/'/g, "\\'")}')">Watch</button>
            <button class="btn-fx-primary" ${done ? 'disabled style="opacity:.55;cursor:default;"' : ''} onclick="fxMarkComplete('${l.id}')">${done ? 'Completed' : 'Mark as Completed'}</button>
          </div>
        </div>
      </div>`;
    }).join('') || `<div class="fx-empty"><div class="icon"><i class="bi bi-camera-video"></i></div>No lessons published for your track yet.</div>`;
  }

  function fxPlay(lessonId, title) {
    const lesson = FxData.lessons().find(l => l.id === lessonId);
    document.getElementById('fxVideoTitle').textContent = title;
    document.getElementById('fxVideoFrame').src = lesson.videoUrl;
    fxOpenModal('fxVideoModal');
  }
  document.getElementById('fxVideoModal').addEventListener('click', function (e) {
    if (e.target === this) { document.getElementById('fxVideoFrame').src = ''; fxCloseModal('fxVideoModal'); }
  });

  function fxMarkComplete(lessonId) {
    const trainee = FxAuth.currentTrainee();
    if (trainee.progress.completedLessonIds.includes(lessonId)) return;
    const ids = [...trainee.progress.completedLessonIds, lessonId];
    const total = trainee.progress.totalLessons || 1;
    const percentage = Math.round((ids.length / total) * 100);
    FxData.updateTrainee(trainee.traineeId, {
      progress: { ...trainee.progress, completedLessons: ids.length, completedLessonIds: ids, percentage }
    });
    fxToast('Lesson marked as completed. Progress updated.', 'success');
    render();
  }

  render();
</script>
</body>
</html>
